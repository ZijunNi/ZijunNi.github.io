<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom CRS Map Demo (tiled base layer + custom markers + road levels + sidebar)</title>

  <!-- Leaflet CDN -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif; color:#111; }
    .app { height: 100%; display: grid; grid-template-columns: 1fr 360px; }
    #map { height: 100%; width: 100%; background:#f5f5f5; }

    .sidebar { height: 100%; border-left: 1px solid #e6e6e6; background: #d9d3c9; display: flex; flex-direction: column; }
    .sidebar-header { background: #3e4556; padding: 14px 14px 10px 14px; border-bottom: 1px solid #eee; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .sidebar-title { display:flex; align-items:center; gap:10px; min-width:0; }
    .sidebar-title-text { min-width:0; }
    .sidebar-icon { width: 28px; height: 28px; object-fit: contain; flex: 0 0 auto; }
    .sidebar-icon[hidden] { display: none; }
    .sidebar-header h2 { color: #d1bd8c; margin: 0; font-size: 18px; font-weight: 650; line-height: 1.2; }
    .sidebar-header .meta { font-size: 12px; color: #d1bd8c; margin-top: 4px; }
    .sidebar-header .meta:empty { display: none; }
    .sidebar-body { color: #6b6c74; padding: 14px; overflow: auto; font-size: 16px; line-height: 1.55; }
    .btn { appearance:none; border:none; background:transparent; padding:0; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:#d1bd8c; border-radius:6px; }
    .btn:hover { background: rgba(209, 189, 140, 0.18); }
    .btn:focus-visible { outline: 2px solid #d1bd8c; outline-offset: 2px; }
    .btn-icon { width:18px; height:18px; display:none; }
    .btn.has-icon .btn-icon { display:block; }
    .btn.has-icon .btn-symbol { display:none; }

    .hud {
      position:absolute; top:10px; left:10px; z-index:1000;
      background: #d9d3c9; border:1px solid #e6e6e6; border-radius:10px;
      padding:10px 12px; box-shadow:0 8px 18px rgba(0,0,0,0.08);
      font-size:12px; line-height:1.45; max-width:560px;
    }
    .hud strong { font-weight:650; }
    .hud code { background:#d9d3c9; padding:1px 4px; border-radius:6px; }

    .app.sidebar-hidden { grid-template-columns: 1fr; }
    .app.sidebar-hidden .sidebar { display: none; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 1fr 260px; }
      .app.sidebar-hidden { grid-template-rows: 1fr; }
      .sidebar { border-left: none; border-top: 1px solid #e6e6e6; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div style="position: relative;">
      <div class="hud" id="hud"></div>
      <div id="map"></div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <img class="sidebar-icon" id="sidebarIcon" alt="" hidden />
          <div class="sidebar-title-text">
            <h2 id="sidebarTitle">未选择标记</h2>
            <div class="meta" id="sidebarMeta">点击地图上的标记点以查看详细信息</div>
          </div>
        </div>
      <button class="btn" id="clearSelectionBtn" aria-label="关闭">
        <img class="btn-icon" id="clearSelectionIcon" src="./assets/close.webp" alt="" />
        <!-- <span class="btn-symbol" aria-hidden="true">×</span> -->
      </button>
      </div>
      <div class="sidebar-body" id="sidebarBody">
        <p>本 Demo 使用自定义坐标系 <code>L.CRS.Simple</code>，底图以 <code>tile pyramid</code>（瓦片金字塔）分块加载。</p>
        <ul>
          <li><strong>坐标约定：</strong>平面像素坐标，点位用 <code>(x, y)</code></li>
          <li>Leaflet 内部坐标为 <code>[y, x]</code>（即 <code>[lat, lng]</code>）</li>
          <li>瓦片路径：<code>assets/tiles/{z}/{x}/{y}.png</code></li>
        </ul>
      </div>
    </aside>
  </div>

  <script src="./data/markers.js"></script>
  <script src="./data/roads.js"></script>
  <script>
    /**
     * =====================================================
     * 你需要配置的核心参数（瓦片加载版本）
     * =====================================================
     * 1) 原始大图像素宽高（仍然必须填写正确，用于 bounds）
     * 2) tiles 的 urlTemplate（离线切片输出目录）
     * 3) tiles 的 minZoom/maxZoom/tileSize 是否与切片工具一致
     */
    const DEFAULT_CONFIG = {
      tiles: {
        urlTemplate: "./assets/tiles/{z}/{x}/{y}.png",
        tileSize: 256,       // 与切片工具一致：常见 256 或 512
        minZoom: 0,          // 通常从 0 开始
        maxZoom: 4,          // 与切片输出的最高层级一致
        opacity: 1.0,
        // 如果你用的是 TMS 输出（y 方向索引不同），把 tms 改为 true
        tms: false
      },

      // 原图像素尺寸（非常关键：用于构造 CRS.Simple 的边界）
      image: {
        width: 2352,   // 改为你的原始大图宽度（像素）
        height: 2628,  // 改为你的原始大图高度（像素）
        origin: { x: 0, y: 0 }, // 旧图在新图中的偏移（用于向左/向上扩展）
        scale: 1       // 标点坐标相对底图的缩放比例（缩放底图时使用）
      },
      coord: {
        // 若原始数据是“左下角为原点”，设为 true 以翻转 y
        flipY: true
      },

      zoom: {
        min: 0,
        max: 4,
        initial: 0
      },
      view: {
        center: { x: 1320, y: 1458 }, // 初始中心（像素坐标）
        zoom: 3
      },
      hud: {
        visible: false // 在此处配置是否显示HUD
      },

      // 道路分级显示规则（基于瓦片 zoom：0..maxZoom）
      roadLevelRules: [
        { level: 1, minZoom: 0 }, // 大范围也显示
        { level: 2, minZoom: 2 }, // 中等放大显示
        { level: 3, minZoom: 4 }, // 更大放大才显示
      ],

      // 标记分级显示规则（基于瓦片 zoom：0..maxZoom）
      markerLevelRules: [
        { level: 1, minZoom: 0 },
        { level: 2, minZoom: 1 },
        { level: 3, minZoom: 2 },
        { level: 4, minZoom: 3 },
        { level: 5, minZoom: 4 }
      ]
    };

    let CONFIG = DEFAULT_CONFIG;
    let map;
    let maxTileZoom = 0;

    function mergeConfig(base, override) {
      const o = override ?? {};
      const merged = { ...base, ...o };
      merged.tiles = { ...base.tiles, ...o.tiles };
      merged.image = { ...base.image, ...o.image };
      merged.coord = { ...base.coord, ...o.coord };
      merged.zoom = { ...base.zoom, ...o.zoom };
      merged.view = { ...base.view, ...o.view };
      merged.hud = { ...base.hud, ...o.hud };
      merged.roadLevelRules = o.roadLevelRules ?? base.roadLevelRules;
      merged.markerLevelRules = o.markerLevelRules ?? base.markerLevelRules;
      return merged;
    }

    async function loadExternalConfig() {
      try {
        const res = await fetch("./tiles.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`tiles.json status ${res.status}`);
        const json = await res.json();
        return mergeConfig(DEFAULT_CONFIG, json);
      } catch (err) {
        console.warn("[map] tiles.json 未加载，使用内置默认配置。", err);
        return DEFAULT_CONFIG;
      }
    }

    function getImageScale() {
      const s = Number(CONFIG?.image?.scale);
      return Number.isFinite(s) && s > 0 ? s : 1;
    }

    /**
     * =====================================================
     * Demo 数据（坐标单位：像素）
     * =====================================================
     */
    const markers = Array.isArray(window.markers) ? window.markers : [];
    const roads = Array.isArray(window.roads) ? window.roads : [];

    /**
     * =====================================================
     * 初始化地图（CRS.Simple）
     * =====================================================
     */
    function initMap() {
      map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: CONFIG.zoom.min,
        maxZoom: CONFIG.zoom.max,
        attributionControl: false,
        zoomControl: true,
        zoomDelta: 0.5,
        zoomSnap: 0.5,
        preferCanvas: true
      });
      map.zoomControl.setPosition("bottomleft");

      // CRS.Simple + 切片：用 maxZoom 把像素坐标映射到 CRS 坐标系
      maxTileZoom = CONFIG.tiles.maxZoom;
      const imageBounds = L.latLngBounds(
        map.unproject([0, 0], maxTileZoom),
        map.unproject([CONFIG.image.width, CONFIG.image.height], maxTileZoom)
      );

      /**
       * =====================================================
       * 底图：瓦片分块加载（核心替换点）
       * =====================================================
       * Leaflet 会根据当前视野/缩放级别，自动请求可见范围内的 tiles：
       *   {z}/{x}/{y}.png
       * 从而避免一次性加载整张超大图。
       */
      const baseTiles = L.tileLayer(CONFIG.tiles.urlTemplate, {
        tileSize: CONFIG.tiles.tileSize,
        minZoom: CONFIG.tiles.minZoom,
        maxZoom: CONFIG.tiles.maxZoom,
        bounds: imageBounds,
        noWrap: true,
        opacity: CONFIG.tiles.opacity,
        tms: CONFIG.tiles.tms,

        // 体验优化（可选）
        keepBuffer: 2,
        updateWhenIdle: true,
        updateWhenZooming: false
      });
      baseTiles.addTo(map);

      // 限制视野在图片范围附近（强烈建议）
      map.setMaxBounds(imageBounds);
      map.setView(toLatLng(CONFIG.view.center.x, CONFIG.view.center.y), CONFIG.view.zoom);
    }

    /**
     * =====================================================
     * Helper：统一坐标转换
     * =====================================================
     */
    function toLatLng(x, y) {
      const scale = getImageScale();
      const origin = CONFIG.image.origin ?? { x: 0, y: 0 };
      const px = (x * scale) + origin.x;
      const pyRaw = (y * scale) + origin.y;
      const py = CONFIG.coord.flipY ? (CONFIG.image.height - pyRaw) : pyRaw;
      return map.unproject([px, py], maxTileZoom);
    }

    function toPixel(latlng) {
      const scale = getImageScale();
      const origin = CONFIG.image.origin ?? { x: 0, y: 0 };
      const p = map.project(latlng, maxTileZoom);
      const pyRaw = CONFIG.coord.flipY ? (CONFIG.image.height - p.y) : p.y;
      return {
        x: (p.x - origin.x) / scale,
        y: (pyRaw - origin.y) / scale
      };
    }

    /**
     * =====================================================
     * 侧边栏
     * =====================================================
     */
    const appRoot = document.querySelector(".app");
    const sidebarTitle = document.getElementById("sidebarTitle");
    const sidebarMeta = document.getElementById("sidebarMeta");
    const sidebarBody = document.getElementById("sidebarBody");
    const sidebarIcon = document.getElementById("sidebarIcon");
    const clearSelectionBtn = document.getElementById("clearSelectionBtn");
    const clearSelectionIcon = document.getElementById("clearSelectionIcon");

    clearSelectionBtn.addEventListener("click", clearSidebar);

    const clearBtnIconUrl = clearSelectionBtn?.dataset.icon || clearSelectionIcon?.getAttribute("src");
    if (clearBtnIconUrl && clearSelectionIcon) {
      if (clearSelectionBtn?.dataset.icon) {
        clearSelectionIcon.src = clearBtnIconUrl;
      }
      clearSelectionBtn?.classList.add("has-icon");
    }

    function setSidebarVisible(visible) {
      appRoot.classList.toggle("sidebar-hidden", !visible);
      // Map container size changes when sidebar is toggled; force Leaflet to recompute tiles.
      requestAnimationFrame(() => {
        if (!map) return;
        map.invalidateSize({ pan: false });
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function updateSidebarIcon(markerData) {
      if (!sidebarIcon) return;
      const iconSpec = markerData?.icon ?? {};

      if (iconSpec.url) {
        sidebarIcon.src = iconSpec.url;
        sidebarIcon.alt = markerData?.name ? `${markerData.name} 图标` : "标记图标";
        sidebarIcon.hidden = false;
        return;
      }

      sidebarIcon.removeAttribute("src");
      sidebarIcon.alt = "";
      sidebarIcon.hidden = true;
    }

    function showMarkerInSidebar(markerData) {
      setSidebarVisible(true);
      sidebarTitle.textContent = markerData.name;
      sidebarMeta.textContent = "";
      updateSidebarIcon(markerData);

      const info = markerData.info ?? {};
      const tags = Array.isArray(info.tags) ? info.tags : [];
      const desc = escapeHtml(info.description ?? "—").replace(/\n/g, "<br>");
      const loca = escapeHtml(info.location ?? "—").replace(/\n/g, "<br>");

      sidebarBody.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:5px;">

        <div style="display:flex; align-items:center; padding:3px 8px; background:#d4c7ac;">
          <img src="./assets/location.png" alt="位置" style="width:12px; height:16px; margin-right:8px;" />
          <div style="font-size:16px; color:#676c71;">${loca}</div>
        </div>

        <div style="font-size:16px; color:#676c71; font-weight:normal; padding:8px 8px;">${desc}</div>

      </div>
      `;
      // 如果需要添加其他元素在侧边栏，可以按照下面的格式向上面的sidebarBody.innerHTML添加内容。
      // sidebarBody.innerHTML = `
      //   <div style="display:flex; flex-direction:column; gap:10px;">
      //     <div>
      //       <div style="font-size:12px; color:#666;">描述</div>
      //       <div>${escapeHtml(info.description ?? "—")}</div>
      //     </div>

      //     <div>
      //       <div style="font-size:12px; color:#666;">坐标（像素）</div>
      //       <div>x: ${markerData.x.toFixed(1)}, y: ${markerData.y.toFixed(1)}</div>
      //     </div>

      //     <div>
      //       <div style="font-size:12px; color:#666;">标签</div>
      //       <div>${tags.length ? tags.map(t => `<span style="display:inline-block;border:1px solid #eee;background:#fafafa;border-radius:999px;padding:3px 8px;margin:4px 6px 0 0;font-size:12px;">${escapeHtml(t)}</span>`).join("") : "—"}</div>
      //     </div>

      //     <div>
      //       <div style="font-size:12px; color:#666;">最后更新</div>
      //       <div>${escapeHtml(info.updatedAt ?? "—")}</div>
      //     </div>

      //     <div>
      //       <div style="font-size:12px; color:#666;">原始数据（示例）</div>
      //       <pre style="margin:0;background:#f7f7f7;border:1px solid #eee;border-radius:10px;padding:10px;overflow:auto;">${escapeHtml(JSON.stringify(markerData, null, 2))}</pre>
      //     </div>
          
    }

    function clearSidebar() {
      sidebarTitle.textContent = "未选择标记";
      sidebarMeta.textContent = "点击地图上的标记点以查看详细信息";
      updateSidebarIcon(null);
      sidebarBody.innerHTML = `<p>已清除选择。</p><p>继续点击标记点以查看详细信息。</p>`;
      setSidebarVisible(false);
    }

    /**
     * =====================================================
     * 道路分级显示/隐藏
     * =====================================================
     */
    const roadLayersByLevel = new Map();

    function initRoadLayers() {
      for (const rule of CONFIG.roadLevelRules) {
        if (!roadLayersByLevel.has(rule.level)) {
          roadLayersByLevel.set(rule.level, L.layerGroup().addTo(map));
        }
      }

      for (const r of roads) {
        const latlngs = r.points.map(p => toLatLng(p.x, p.y));
        const polyline = L.polyline(latlngs, {
          weight: r.level === 1 ? 6 : (r.level === 2 ? 4 : 3),
          opacity: 0.9
        });
        polyline.bindTooltip(`${r.name} (L${r.level})`, { sticky: true });

        const group = roadLayersByLevel.get(r.level);
        if (group) group.addLayer(polyline);
      }
    }

    function updateRoadVisibility() {
      const z = map.getZoom();
      const visibleLevels = new Set(
        CONFIG.roadLevelRules.filter(rule => z >= rule.minZoom).map(rule => rule.level)
      );

      for (const [level, group] of roadLayersByLevel.entries()) {
        const shouldShow = visibleLevels.has(level);
        const onMap = map.hasLayer(group);
        if (shouldShow && !onMap) group.addTo(map);
        if (!shouldShow && onMap) map.removeLayer(group);
      }
    }

    /**
     * =====================================================
     * Marker（支持自定义图标 png/svg/jpg 或 divIcon）
     * =====================================================
     */
    const markerLayersByLevel = new Map();
    const markerObjects = [];

    function initMarkerLayers() {
      for (const rule of CONFIG.markerLevelRules) {
        if (!markerLayersByLevel.has(rule.level)) {
          markerLayersByLevel.set(rule.level, L.layerGroup().addTo(map));
        }
      }
    }

    function createLeafletIcon(iconSpec) {
      if (iconSpec?.divIcon) {
        return L.divIcon({
          html: iconSpec.html ?? "",
          className: "",
          iconSize: iconSpec.size ?? [16, 16],
          iconAnchor: iconSpec.anchor ?? [8, 8]
        });
      }
      return L.icon({
        iconUrl: iconSpec?.url ?? "./marker.png",
        iconSize: iconSpec?.size ?? [28, 28],
        iconAnchor: iconSpec?.anchor ?? [14, 28]
      });
    }

    function initMarkers() {
      for (const m of markers) {
        const icon = createLeafletIcon(m.icon);
        const leafletMarker = L.marker(toLatLng(m.x, m.y), { title: m.name, icon });

        leafletMarker.on("click", (e) => {
          L.DomEvent.stopPropagation(e);
          showMarkerInSidebar(m);
        });

        const group = markerLayersByLevel.get(m.level) ?? markerLayersByLevel.get(1);
        if (group) {
          leafletMarker.addTo(group);
        } else {
          leafletMarker.addTo(map);
        }
        markerObjects.push({ data: m, leafletMarker });
      }
    }

    function updateMarkerVisibility() {
      const z = map.getZoom();
      const rulesByLevel = new Map(CONFIG.markerLevelRules.map(rule => [rule.level, rule]));

      for (const [level, group] of markerLayersByLevel.entries()) {
        const rule = rulesByLevel.get(level);
        const shouldShow = rule ? z >= rule.minZoom : true;
        const onMap = map.hasLayer(group);
        if (shouldShow && !onMap) group.addTo(map);
        if (!shouldShow && onMap) map.removeLayer(group);
      }
    }

    /**
     * =====================================================
     * HUD：显示 zoom、鼠标坐标、规则
     * =====================================================
     */
    const hud = document.getElementById("hud");

    function isHudEnabled() {
      return CONFIG?.hud?.visible !== false;
    }

    function setHudVisible() {
      if (!hud) return;
      hud.style.display = isHudEnabled() ? "" : "none";
    }

    function refreshHud(extraLine = "") {
      if (!isHudEnabled() || !hud) return;
      const z = map.getZoom();
      const c = map.getCenter();
      const centerPx = toPixel(c);
      const rulesText = CONFIG.roadLevelRules.map(r => `L${r.level}: zoom ≥ ${r.minZoom}`).join(", ");
      const markerRulesText = CONFIG.markerLevelRules.map(r => `L${r.level}: zoom ≥ ${r.minZoom}`).join(", ");
      const origin = CONFIG.image.origin ?? { x: 0, y: 0 };
      const scale = getImageScale();

      hud.innerHTML = `
        <div><strong>坐标系：</strong><code>CRS.Simple</code>（平面/像素坐标）</div>
        <div><strong>底图：</strong>瓦片 <code>{z}/{x}/{y}</code>，tileSize=<code>${CONFIG.tiles.tileSize}</code>，tms=<code>${CONFIG.tiles.tms}</code></div>
        <div><strong>当前视图：</strong>zoom = <code>${z}</code>,
          center = <code>x=${centerPx.x.toFixed(1)}, y=${centerPx.y.toFixed(1)}</code></div>
        <div><strong>道路显示规则：</strong>${escapeHtml(rulesText)}</div>
        <div><strong>标记显示规则：</strong>${escapeHtml(markerRulesText)}</div>
        <div style="color:#666;margin-top:6px;">原图尺寸：<code>${CONFIG.image.width}×${CONFIG.image.height}</code>（像素）</div>
        <div style="color:#666;margin-top:4px;">origin：<code>${origin.x}, ${origin.y}</code>，scale：<code>${scale}</code></div>
        ${extraLine ? `<div style="margin-top:6px;"><strong>鼠标：</strong>${extraLine}</div>` : ``}
      `;
    }

    function bindMapEvents() {
      map.on("mousemove", (e) => {
        const px = toPixel(e.latlng);
        refreshHud(`x=${px.x.toFixed(1)}, y=${px.y.toFixed(1)}`);
      });

      map.on("click", () => {
        clearSidebar();
      });

      map.on("zoomend moveend", refreshAll);
    }

    /**
     * =====================================================
     * 刷新逻辑：缩放/移动后自动更新显隐
     * =====================================================
     */
    function refreshAll() {
      updateRoadVisibility();
      updateMarkerVisibility();
      refreshHud();
    }

    async function initApp() {
      CONFIG = await loadExternalConfig();
      initMap();
      setHudVisible();
      bindMapEvents();
      initRoadLayers();
      initMarkerLayers();
      initMarkers();
      setSidebarVisible(false);
      refreshAll();
    }

    initApp();
  </script>
</body>
</html>
